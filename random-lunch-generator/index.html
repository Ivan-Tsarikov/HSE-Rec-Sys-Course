<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Lunch Menu Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1><span aria-hidden="true">🍽️</span> Random Lunch Generator</h1>
        <p class="description">Struggling to decide what to eat? Let us choose for you with just one click!</p>

        <div class="lunch-display" aria-live="polite" aria-atomic="true">
            <div class="food-icon"><span aria-hidden="true">❓</span></div>
            <div class="food-name">What's for lunch?</div>
        </div>

        <button class="generate-btn" id="generateBtn" type="button">
            <span aria-hidden="true">🎲</span> Generate Lunch!
        </button>

        <p class="footer">Click the button again if you can't decide!</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
